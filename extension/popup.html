<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 12px;
      text-align: center;
      background-color: #f8f9fa;
    }
    h3 {
      margin-top: 0;
      color: #3f51b5; /* Purple theme matching Jucite */
      font-size: 16px;
    }
    button {
      background-color: #3f51b5;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #303f9f;
    }
    button:disabled {
      background-color: #bdbdbd;
      cursor: not-allowed;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #616161;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>Jucite Connector</h3>
  <div id="status">Scanning page for DOI...</div>
  <button id="save-btn" disabled>Save to Jucite</button>
  
  <!-- Link our JavaScript file -->
  <script src="popup.js"></script>
</body>
</html>
