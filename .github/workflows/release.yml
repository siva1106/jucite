 name: Build and Release Jucite (AppImage, EXE, DMG)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. LINUX SINGLE FILE: Jucite-Linux-x86_64.AppImage
  build-linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux AppImage Dependencies
        run: sudo apt-get update && sudo apt-get install -y file libfuse2 desktop-file-utils

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Compile Jucite Standalone
        run: julia build.jl

      - name: Package as Single AppImage
        run: |
          mkdir -p AppDir/usr
          cp -r JuciteApp/* AppDir/usr/
          if [ -f src/assets/icon.png ]; then
            cp src/assets/icon.png AppDir/jucite.png
            cp src/assets/icon.png AppDir/.DirIcon
          else
            cp src/assets/logo.png AppDir/jucite.png
            cp src/assets/logo.png AppDir/.DirIcon
          fi
          
          cat << 'APPRUN' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export JULIA_DEPOT_PATH="$HERE/usr/share/julia"
          cd "$HERE/usr/bin"
          exec "./Jucite" "$@"
          APPRUN
          chmod +x AppDir/AppRun
          
          cat << 'DESKTOP' > AppDir/Jucite.desktop
          [Desktop Entry]
          Name=Jucite
          Exec=Jucite
          Icon=jucite
          Type=Application
          Categories=Education;Science;
          DESKTOP
          
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Jucite-Linux-x86_64.AppImage

      - name: Save Linux Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jucite-Linux-AppImage
          path: Jucite-Linux-x86_64.AppImage

  # 2. WINDOWS SINGLE FILE: Jucite-Windows-Setup.exe
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Compile Jucite Standalone
        run: julia build.jl

      - name: Compile Single .exe Installer (Inno Setup)
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppName=Jucite Reference Manager
          AppVersion=1.0.1
          AppPublisher=RectoPress
          AppPublisherURL=https://rectopress.com/
          DefaultDirName={autopf}\Jucite
          DefaultGroupName=Jucite Reference Manager
          OutputDir=.
          OutputBaseFilename=Jucite-Windows-Setup
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "JuciteApp\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Jucite Reference Manager"; Filename: "{app}\bin\Jucite.exe"
          Name: "{autodesktop}\Jucite Reference Manager"; Filename: "{app}\bin\Jucite.exe"

          [Run]
          Filename: "{app}\bin\Jucite.exe"; Description: "Launch Jucite Reference Manager"; Flags: nowait postinstall skipifsilent
          "@
          $iss | Out-File -Encoding ASCII installer.iss
          iscc installer.iss

      - name: Save Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jucite-Windows-EXE
          path: Jucite-Windows-Setup.exe

  # 3. MACOS SINGLE FILE: Jucite-macOS.dmg
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Compile Jucite Standalone
        run: julia build.jl

      - name: Package as Native macOS .dmg
        run: |
          mkdir -p "Jucite.app/Contents/MacOS"
          mkdir -p "Jucite.app/Contents/Resources"
          cp -r JuciteApp/* "Jucite.app/Contents/Resources/"
          
          cat << 'MACRUN' > "Jucite.app/Contents/MacOS/Jucite"
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")/../Resources/bin" && pwd)"
          export JULIA_DEPOT_PATH="$(cd "$(dirname "$0")/../Resources/share/julia" && pwd)"
          cd "$DIR"
          exec "./Jucite"
          MACRUN
          chmod +x "Jucite.app/Contents/MacOS/Jucite"
          
          cat << 'PLIST' > "Jucite.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Jucite</string>
              <key>CFBundleIdentifier</key>
              <string>com.rectopress.jucite</string>
              <key>CFBundleName</key>
              <string>Jucite Reference Manager</string>
              <key>CFBundleVersion</key>
              <string>1.0.1</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </plist>
          PLIST
          
          hdiutil create -volname "Jucite Reference Manager" -srcfolder "Jucite.app" -ov -format UDZO Jucite-macOS.dmg

      - name: Save macOS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jucite-macOS-DMG
          path: Jucite-macOS.dmg

  # 4. PUBLISH ALL 3 INSTALLERS TOGETHER IN ONE ATOMIC RELEASE
  publish-release:
    name: Publish All 3 Installers to Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Download All 3 Compiled Installers
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Publish Single Release with All 3 OS Installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.1"
          name: "Jucite Reference Manager v1.0.1 (Linux, Windows, macOS)"
          files: |
            release_files/Jucite-Linux-x86_64.AppImage
            release_files/Jucite-Windows-Setup.exe
            release_files/Jucite-macOS.dmg
EOF

# Push and tag v1.0.1 so all 3 files publish together!
git add .github/workflows/release.yml
git commit -m "Release: Publish Linux AppImage, Windows EXE, and macOS DMG together in one atomic release"
git push origin master

git tag -f v1.0.1
git push -f origin v1.0.1