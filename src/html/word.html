<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Jucite Word Add-in</title>
    <!-- Microsoft Office Official JavaScript API -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f4f4f5; padding: 12px; margin: 0; user-select: none; }
      .plugin-btn { display: flex; align-items: center; gap: 8px; width: 100%; background: white; border: 1px solid #d1d5db; padding: 9px 12px; margin-bottom: 6px; border-radius: 4px; font-size: 12px; font-weight: 600; color: #374151; cursor: pointer; transition: 0.1s; text-align: left; }
      .plugin-btn:hover { background: #f3f4f6; border-color: #9ca3af; }
      .btn-green { background: #10b981 !important; color: white !important; border: none !important; }
      .btn-green:hover { background: #059669 !important; }
      .search-box { width: 100%; padding: 8px; border: 1px solid #9ca3af; border-radius: 4px; box-sizing: border-box; font-size: 12px; outline: none; margin-bottom: 8px; }
      .search-box:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,0.2); }
      .item { background: white; border: 1px solid #e5e7eb; padding: 8px; margin-bottom: 4px; border-radius: 4px; cursor: pointer; }
      .item:hover { border-color: #4f46e5; background: #eef2ff; }
      .title { font-weight: bold; color: #111827; font-size: 11px; margin-bottom: 2px; }
      .sub { color: #6b7280; font-size: 10px; }
      .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17, 24, 39, 0.5); z-index: 100; }
      .modal-content { background: white; margin: 10% auto; padding: 16px; width: 85%; border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
      .style-results { max-height: 220px; overflow-y: auto; margin-top: 8px; border: 1px solid #e5e7eb; border-radius: 4px; }
      .style-item { padding: 8px; border-bottom: 1px solid #f3f4f6; cursor: pointer; color: #374151; font-size: 11px; }
      .style-item:hover { background: #eff6ff; color: #4f46e5; font-weight: bold; }
    </style>
  </head>
  <body>

    <!-- STYLE BADGE -->
    <div style="background: #4f46e5; color: white; font-weight: bold; padding: 8px; border-radius: 4px; margin-bottom: 12px; font-size: 10px; text-align: center;">
      <span id="activeStyleDisplay">Style: APA 7th Edition</span>
    </div>

    <!-- 5 ZOTERO BUTTONS -->
    <button class="plugin-btn" onclick="document.getElementById('searchArea').style.display='block'">📄 Add/Edit Citation</button>
    <button class="plugin-btn btn-green" onclick="insertBibliographyInWord()">🔄 Update Bibliography</button>
    <button class="plugin-btn" onclick="document.getElementById('styleModal').style.display='block'; searchStyles();">⚙️ Document Preferences</button>
    <button class="plugin-btn" onclick="insertBibliographyInWord()">🔄 Refresh</button>
    <button class="plugin-btn" onclick="clearMemory()">🔗 Unlink Citations</button>

    <!-- SEARCH AREA -->
    <div id="searchArea" style="display:none; margin-top: 14px; padding-top: 14px; border-top: 1px solid #d1d5db;">
      <div style="font-weight: bold; font-size: 10px; color: #9ca3af; margin-bottom: 8px; text-transform: uppercase;">Search Jucite Library</div>
      <input type="text" id="searchBox" class="search-box" placeholder="Search author, title, year..." oninput="searchJucite()">
      <div id="results"></div>
    </div>

    <!-- 10,000+ STYLE MANAGER MODAL -->
    <div id="styleModal" class="modal">
      <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h3 style="margin:0; font-size:12px; color:#111827;">Document Preferences</h3>
          <button onclick="document.getElementById('styleModal').style.display='none'" style="background:none; border:none; cursor:pointer; color:#9ca3af; font-size:16px;">&times;</button>
        </div>
        <input type="text" id="styleSearchBox" class="search-box" placeholder="Search 10,000+ styles..." oninput="searchStyles()">
        <div id="styleResults" class="style-results"></div>
      </div>
    </div>

    <script>
      let activeStyleId = 'apa';
      let savedRefs = [];

      // INITIALIZE MICROSOFT OFFICE API
      Office.onReady((info) => {
        if (info.host === Office.HostType.Word) {
          console.log("✅ Jucite connected directly to Microsoft Word!");
        }
      });

      function searchStyles() {
        const q = document.getElementById('styleSearchBox').value.trim();
        const resDiv = document.getElementById('styleResults');
        fetch('http://127.0.0.1:8080/api/styles/search?q=' + encodeURIComponent(q))
          .then(res => res.json())
          .then(styles => {
            if(styles.length === 0) { resDiv.innerHTML = "<div style='padding:10px; color:#9ca3af; font-size:10px;'>No styles found.</div>"; return; }
            resDiv.innerHTML = styles.map(s => `
              <div class="style-item" onclick="setStyle('${s.name}', '${s.title.replace(/'/g, "\\'")}')">${s.title}</div>
            `).join('');
          });
      }

      function setStyle(id, title) {
        activeStyleId = id;
        document.getElementById('activeStyleDisplay').innerText = "Style: " + title;
        document.getElementById('styleModal').style.display = 'none';
        insertBibliographyInWord();
      }

      function searchJucite() {
        const q = document.getElementById('searchBox').value.trim();
        const resultsDiv = document.getElementById('results');
        if (q.length < 2) { resultsDiv.innerHTML = ""; return; }

        fetch('http://127.0.0.1:8080/api/search?q=' + encodeURIComponent(q))
          .then(res => res.json())
          .then(papers => {
            resultsDiv.innerHTML = papers.map(p => `
              <div class="item" onclick="addCitationToWord(${p.id})">
                <div class="title">${p.title}</div>
                <div class="sub">${p.authors[0]?.family || 'Unknown'} (${p.year})</div>
              </div>
            `).join('');
          });
      }

      // --- INSERT CITATION INTO MICROSOFT WORD ---
      function addCitationToWord(paperId) {
        fetch(`http://127.0.0.1:8080/api/format-citation?id=${paperId}&style=${activeStyleId}`)
          .then(res => res.json())
          .then(data => {
            const inText = data.in_text || "[Citation]";
            const bib = data.bibliography || "";

            // MICROSOFT OFFICE NATIVE API CALL
            Word.run(async (context) => {
              const selection = context.document.getSelection();
              selection.insertText(inText, Word.InsertLocation.replace);
              await context.sync();

              if (bib && !savedRefs.includes(bib)) {
                savedRefs.push(bib);
              }
            });

            document.getElementById('searchBox').value = '';
            document.getElementById('results').innerHTML = '';
          });
      }

      // --- INSERT BIBLIOGRAPHY INTO MICROSOFT WORD ---
      function insertBibliographyInWord() {
        if (savedRefs.length === 0) return;
        
        Word.run(async (context) => {
          const body = context.document.body;
          body.insertParagraph("\nReferences", Word.InsertLocation.end);
          
          for (let i = 0; i < savedRefs.length; i++) {
            body.insertParagraph(savedRefs[i], Word.InsertLocation.end);
          }
          await context.sync();
        });
      }

      function clearMemory() {
        savedRefs = [];
        alert("Document references unlinked.");
      }
    </script>
  </body>
</html>
