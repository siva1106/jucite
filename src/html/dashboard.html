<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jucite Desktop Dashboard</title>
  <!-- Load Tailwind CSS for a beautiful, modern UI -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="max-w-6xl mx-auto py-10 px-4">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-indigo-700 tracking-tight">📚 Jucite Library</h1>
        <p class="text-sm text-slate-500 mt-1">Your local-first, private academic repository</p>
      </div>
      <div class="text-xs bg-indigo-100 text-indigo-800 font-bold px-3 py-1.5 rounded-full">
        Linux Desktop Mode
      </div>
    </div>

    <!-- Search Bar -->
    <div class="mb-6">
      <input type="text" id="search" placeholder="Search by title, journal, or year..." 
             class="w-full px-4 py-3 rounded-lg border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
    </div>

    <!-- Library Table -->
    <div class="bg-white rounded-xl shadow-md border border-slate-100 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-indigo-50 text-indigo-700 text-xs font-bold uppercase tracking-wider border-b border-indigo-100">
            <th class="p-4 w-12">ID</th>
            <th class="p-4">Title</th>
            <th class="p-4 w-24">Year</th>
            <th class="p-4 w-32 text-center">PDF</th>
          </tr>
        </thead>
        <tbody id="library-body" class="divide-y divide-slate-100">
          <!-- Papers will be loaded here dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const libraryBody = document.getElementById('library-body');
    const searchInput = document.getElementById('search');
    let allPapers = [];

    // 1. Fetch papers from the Julia local API
    function loadLibrary() {
      fetch('/api/library')
        .then(res => res.json())
        .then(data => {
          allPapers = data;
          renderPapers(allPapers);
        })
        .catch(err => {
          libraryBody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500 font-semibold">Error connecting to Jucite backend. Is the server running?</td></tr>`;
        });
    }

    // 2. Render papers into HTML rows
    function renderPapers(papers) {
      if (papers.length === 0) {
        libraryBody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400">Your library is empty. Save a paper using your browser extension!</td></tr>`;
        return;
      }

      libraryBody.innerHTML = papers.map(paper => `
        <tr class="hover:bg-slate-50 transition">
          <td class="p-4 text-sm font-semibold text-slate-400">${paper.id}</td>
          <td class="p-4">
            <div class="font-bold text-slate-800 text-sm leading-snug">${paper.title}</div>
            <div class="text-xs text-slate-400 mt-0.5">${paper.journal}</div>
          </td>
          <td class="p-4 text-sm font-medium text-slate-600">${paper.year}</td>
          <td class="p-4 text-center">
            ${paper.pdf_path ? `
              <button onclick="openPDF(${paper.id})" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded transition">
                📄 Open PDF
              </button>
            ` : `
              <span class="text-xs text-slate-400 font-semibold">No File</span>
            `}
          </td>
        </tr>
      `).join('');
    }

    // 3. Trigger Julia to open the PDF in the native Linux viewer
    function openPDF(id) {
      fetch(`/api/open-pdf?id=${id}`)
        .then(res => {
          if (!res.ok) alert("Could not open PDF file.");
        });
    }

    // 4. Client-side Search Filter
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allPapers.filter(paper => 
        paper.title.toLowerCase().includes(query) || 
        paper.journal.toLowerCase().includes(query) || 
        paper.year.toString().includes(query)
      );
      renderPapers(filtered);
    });

    // Load library immediately on page load
    loadLibrary();
  </script>
</body>
</html>
